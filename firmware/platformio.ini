[platformio]
default_envs = esp32dev
test_dir = ../tests

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@2.4.1   ; frozen: WebSocket transport (Phase 3 Step 3)

; ---------------------------------------------------------------------------
; Package 1: interlock regression environment
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = custom
test_build_src = true
test_filter = test_interlock_field_update
build_src_filter = +<safety/interlocks.cpp>
build_flags =
    -std=c++17
    -I../tests/mocks
    -Iinclude

; ---------------------------------------------------------------------------
; Package 3: measurement conversion regression environment
; ---------------------------------------------------------------------------
[env:native-conversion]
platform = native
test_framework = custom
test_build_src = true
test_filter = test_measurement_conversion
build_src_filter = +<services/measurement_conversion.cpp>
build_flags =
    -std=c++17
    -I../tests/mocks
    -Iinclude

; ---------------------------------------------------------------------------
; Package 4: calibration payload schema/codec regression environment
; ---------------------------------------------------------------------------
[env:native-calibration-payload]
platform = native
test_framework = custom
test_build_src = true
test_filter = test_calibration_payload
build_src_filter =
    +<services/measurement_conversion.cpp>
    +<services/calibration_payload.cpp>
build_flags =
    -std=c++17
    -I../tests/mocks
    -Iinclude
