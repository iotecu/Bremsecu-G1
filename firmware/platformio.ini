[platformio]
default_envs = esp32dev
test_dir = ../tests

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@2.4.1   ; frozen: WebSocket transport (Phase 3 Step 3)

; ---------------------------------------------------------------------------
; Package 1: Host-side test environment
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = custom
test_build_src = true
build_src_filter = +<safety/interlocks.cpp>
build_flags =
    -std=c++17
    -I../tests/mocks
    -Iinclude