    -std=c++17
    -I../tests/test_json_lite
    -Iinclude

[env:native-record-json-codec]
platform = native
test_framework = custom
test_build_src = false
test_filter = test_record_json_codec
build_flags =
    -std=c++17
    -I../tests/test_record_json_codec
