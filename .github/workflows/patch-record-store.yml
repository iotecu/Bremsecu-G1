name: patch-record-store-once

on:
  push:
    branches: [ 'review/remediation-final-candidate' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review/remediation-final-candidate
          fetch-depth: 0

      - name: Apply exact RecordStore parser patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('firmware/src/storage/record_store.cpp')
          s = p.read_text()
          if '#include "record_json_codec.h"' in s:
              print('RecordStore patch already applied')
              raise SystemExit(0)

          s = s.replace('#include "rtc_service.h"\n', '#include "rtc_service.h"\n#include "record_json_codec.h"\n')

          old_helpers = r'''bool findKey(const String& body, const char* key, size_t& vp) {
            String needle = String("\"") + key + "\":\"";
            int idx = body.indexOf(needle);
            if (idx < 0) return false;
            vp = (size_t)idx + needle.length();
            return vp <= body.length();
          }
          bool jgetString(const String& body, const char* key, char* out, size_t outLen) {
            size_t vp = 0;
            if (!findKey(body, key, vp)) return false;
            size_t o = 0;
            for (size_t i = vp; i < body.length(); ++i) {
              char c = body[i];
              if (c == '\\' && i + 1 < body.length()) {
                ++i; const char e = body[i];
                switch (e) { case '"': c='"'; break; case '\\': c='\\'; break;
                  case 'n': c='\n'; break; case 'r': c='\r'; break; case 't': c='\t'; break;
                  default: return false; }
              } else if (c == '"') { out[o] = '\0'; return true; }
              if (o + 1 >= outLen) return false;
              out[o++] = c;
            }
            return false;
          }
          bool jgetUint32(const String& body, const char* key, uint32_t& out) {
            String needle = String("\"") + key + "\":";
            int idx = body.indexOf(needle);
            if (idx < 0) return false;
            const char* start = body.c_str() + idx + needle.length();
            char* end = nullptr;
            unsigned long v = strtoul(start, &end, 10);
            if (end == start) return false;
            out = (uint32_t)v; return true;
          }

          '''
          if old_helpers not in s:
              raise SystemExit('Expected legacy JSON helper block not found')
          s = s.replace(old_helpers, '')

          start = s.index('RecordError deserialize(const String& body, const char* expectedId, ServiceRecord& out) {')
          end_marker = '\n}\n\nRecordError loadRecord('
          end = s.index(end_marker, start) + 2
          new_deserialize = r'''RecordError deserialize(const String& body, const char* expectedId, ServiceRecord& out) {
            ServiceRecord r{};
            const RecordError parsed = RecordJsonCodec::parseServiceRecord(body, expectedId, r);
            if (parsed != RecordError::NONE) return RecordError::MALFORMED;
            if (validateFields(r) != RecordError::NONE) return RecordError::MALFORMED;
            out = r;
            return RecordError::NONE;
          }'''
          s = s[:start] + new_deserialize + s[end:]
          p.write_text(s)
          PY

      - name: Commit structural parser migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/src/storage/record_store.cpp
          git commit -m "Fix review finding: structural ServiceRecord JSON parsing"
          git push origin HEAD:review/remediation-final-candidate
