      - name: Validate PNG dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          files = sorted(Path("docs/figma/screens").glob("*.png"))
          assert len(files) == 40, f"expected 40 screenshots, found {len(files)}"
          for p in files:
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"not PNG: {p}"
              w, h = struct.unpack(">II", data[16:24])
              assert (w, h) == (390, 844), f"wrong size {w}x{h}: {p}"
              assert len(data) > 1000, f"suspiciously small: {p}"
          print(f"validated {len(files)} screenshots at 390x844")
          PY
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/figma/screens
          git commit -m "docs(figma): refresh final screen references" || exit 0
          git push origin HEAD:review/figma-final-handoff
