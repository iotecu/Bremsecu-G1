name: Figma Screenshot Sync

on:
  push:
    branches:
      - review/figma-final-handoff
    paths:
      - .github/workflows/figma-screenshot-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/figma-final-handoff
      - name: Replace screenshot reference set
        run: |
          set -euo pipefail
          mkdir -p docs/figma/screens
          find docs/figma/screens -mindepth 1 -maxdepth 1 -type f -delete
          curl -fL --retry 2 --retry-delay 1 -o "docs/figma/screens/01-login.png" "https://www.figma.com/api/mcp/asset/b6ce123b-dc5e-4b3d-ba74-a1fe34fe7d43.png"
          curl -fL --retry 2 --retry-delay 1 -o "docs/figma/screens/02-vehicle-entry.png" "https://www.figma.com/api/mcp/asset/b1312923-cf74-440b-a76e-f9e20de2daae.png"
