name: package7-api-patch

on:
  push:
    branches: [ 'review/package-7-confirmation-lifecycle' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Package 7 API integration
        run: python tools/apply_package7_api_patch.py

      - name: Commit patched API and remove one-shot helper
        run: |
          rm tools/apply_package7_api_patch.py
          rm .github/workflows/package7-api-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Package 7: integrate confirmation lifecycle into API"
          git push origin HEAD:review/package-7-confirmation-lifecycle
