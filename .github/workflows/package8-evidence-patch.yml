name: package8-evidence-patch

on:
  push:
    branches: [ 'review/package-8-load-test-safety' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Package 8 telemetry/storage evidence integration
        run: python tools/apply_package8_evidence_patch.py

      - name: Commit patched files and remove one-shot helper
        run: |
          rm tools/apply_package8_evidence_patch.py
          rm .github/workflows/package8-evidence-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Package 8: expose load safety evidence"
          git push origin HEAD:review/package-8-load-test-safety
